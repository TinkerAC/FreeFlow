services:
  postgres:
    image: postgres:16-alpine
    container_name: freeflow-web25-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: freeflow_web25
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - freeflow_web25_postgres:/var/lib/postgresql/data

volumes:
  freeflow_web25_postgres:
